<style>
/* =====================================================================
   CODERA DESIGN SYSTEM
   Codera Blue = brand actions. Deep navy = depth. Amber = progress / success only.
   ===================================================================== */
:root{
  --font:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --brand:#0074D9;           /* hsl(207.93 100% 42.55%) */
  --grow:#FFB43A;
  --maxw:1240px; --gut:clamp(20px,5vw,64px); --r:6px; --ease:cubic-bezier(.2,.7,.2,1);
  --hh:calc(72px + env(safe-area-inset-top,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);

  /* signature interaction state (set by JS) */
  --d:0;--chrome:0;--frac:1;--prev:0;--site:0;--tabs:0;--url:0;--term:0;--t1:0;--t2:0;--t3:0;
}
:root,:root[data-theme="light"]{
  --paper:#F6F8FB;--paper-2:#E8EDF4;--paper-fg:#0E1B2A;--paper-accent:#0063B8;
  --ink:#0D1A2A;--ink-fg:#EAF0F8;--ink-accent:#6DB6FF;--deep:#081321;
  --a-prop:#9A4D00;--a-str:#0F7B5F;--a-err:#C4262E;--z-prop:#FFC878;--z-str:#7FE0B8;--z-err:#FF8A8A;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#101F33;--paper-2:#0B1829;--paper-fg:#E8EEF6;--paper-accent:#6DB6FF;
  --ink:#060E18;--ink-fg:#EAF0F8;--ink-accent:#6DB6FF;--deep:#03080F;
  --a-prop:#FFC878;--a-str:#7FE0B8;--a-err:#FF8A8A;
  color-scheme:dark;
}
:root{
  /* the signature page blends blank paper (d=0) into deep navy (d=1) */
  --a-bg:var(--paper);--a-fg:var(--paper-fg);--a-accent:var(--paper-accent);
  --z-bg:var(--ink);--z-fg:var(--ink-fg);--z-accent:var(--ink-accent);
  --bg:color-mix(in oklab,var(--z-bg) calc(var(--d) * 100%),var(--a-bg));
  --fg:color-mix(in oklab,var(--z-fg) calc(var(--d) * 100%),var(--a-fg));
  --accent:color-mix(in oklab,var(--z-accent) calc(var(--d) * 100%),var(--a-accent));
  --prop:color-mix(in oklab,var(--z-prop) calc(var(--d) * 100%),var(--a-prop));
  --str:color-mix(in oklab,var(--z-str) calc(var(--d) * 100%),var(--a-str));
  --err:color-mix(in oklab,var(--z-err) calc(var(--d) * 100%),var(--a-err));
  --muted:color-mix(in oklab,var(--fg) 64%,var(--bg));
  --line:color-mix(in oklab,var(--fg) 16%,var(--bg));
  --win:color-mix(in oklab,var(--fg) 5%,var(--bg));
}

/* ---- tones: every chapter picks one, so rhythm is controlled by content, not by CSS order ---- */
.tone-paper{--bg:var(--paper);--fg:var(--paper-fg);--accent:var(--paper-accent)}
.tone-paper2{--bg:var(--paper-2);--fg:var(--paper-fg);--accent:var(--paper-accent)}
.tone-ink{--bg:var(--ink);--fg:var(--ink-fg);--accent:var(--ink-accent)}
.tone-deep{--bg:var(--deep);--fg:var(--ink-fg);--accent:var(--ink-accent)}
.tone-blue{--bg:var(--brand);--fg:#fff;--accent:#fff}
.tone-paper,.tone-paper2,.tone-ink,.tone-deep,.tone-blue{
  background:var(--bg);color:var(--fg);
  --muted:color-mix(in oklab,var(--fg) 68%,var(--bg));
  --line:color-mix(in oklab,var(--fg) 16%,var(--bg));
  --win:color-mix(in oklab,var(--fg) 5%,var(--bg));
}
.tone-blue{--muted:rgba(255,255,255,.86);--line:rgba(255,255,255,.28)}

/* ---- base ---- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:var(--hh);-webkit-text-size-adjust:100%;background:var(--bg)}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
img,svg,video{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;inset-block-start:8px;inset-inline-start:8px;z-index:300;transform:translateY(-220%);background:var(--brand);color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none}
.skip:focus{transform:none}
main:focus{outline:none}

.wrap{width:100%;max-width:calc(var(--maxw) + var(--gut) * 2);margin-inline:auto;padding-inline:var(--gut)}
.sec{padding-block:clamp(72px,10vw,140px)}
.sec-tight{padding-block:clamp(32px,5vw,64px) clamp(64px,8vw,120px)}
.sec-h{display:grid;gap:16px;max-width:46rem}
.sec-h-row{display:flex;justify-content:space-between;align-items:end;gap:24px;max-width:none}
.sec-more{margin-top:48px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ---- type ---- */
.display{font-weight:600;font-size:clamp(2.4rem,6vw,5.2rem);line-height:1.25;text-wrap:balance}
.h2{font-weight:600;font-size:clamp(1.9rem,4vw,3.3rem);line-height:1.3;text-wrap:balance}
.h3{font-weight:600;font-size:clamp(1.25rem,2vw,1.65rem);line-height:1.45}
.h4{font-weight:600;font-size:1rem;margin-bottom:6px}
.lead{font-size:clamp(1.05rem,1.5vw,1.25rem);line-height:1.95;color:var(--muted);max-width:38em}
.statement{font-size:clamp(1.3rem,2.6vw,2.1rem);line-height:1.7;font-weight:300;max-width:30em}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
[lang="en"] .display,[lang="en"] .h2,[lang="en"] .h3,[lang="en"] .statement{line-height:1.15;letter-spacing:-.012em}
[lang="en"] .statement{line-height:1.45}
[lang="en"] .lead{line-height:1.65}

/* ---- icons ---- */
.i{width:1.2em;height:1.2em;flex:none}
[dir="rtl"] .i-arrow,[dir="rtl"] .i-next,[dir="rtl"] .i-prev{transform:scaleX(-1)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:48px;padding:0 1.5em;border-radius:999px;border:1.5px solid transparent;
  font:500 1rem/1.2 var(--font);text-decoration:none;cursor:pointer;transition:transform .2s var(--ease),background-color .2s,border-color .2s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.btn-solid{background:var(--brand);color:#fff}
.btn-solid:hover{background:color-mix(in oklab,var(--brand) 86%,#000)}
.tone-blue .btn-solid{background:#fff;color:#004E94}
.btn-ghost{background:transparent;color:var(--fg);border-color:color-mix(in oklab,var(--fg) 32%,transparent)}
.btn-ghost:hover{border-color:var(--fg)}
.btn-wa{background:#128C4A;color:#fff}
.btn-wa:hover{background:#0F7A41}
.btn.sm{min-height:40px;padding:0 1.15em;font-size:.92rem}
.btn.lg{min-height:56px;padding:0 1.9em;font-size:1.05rem}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-width:44px;min-height:44px;padding:0 8px;border:0;border-radius:10px;background:transparent;color:inherit;cursor:pointer;transition:background-color .2s}
.icon-btn:hover{background:color-mix(in oklab,currentColor 10%,transparent)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.link-arrow{display:inline-flex;align-items:center;gap:.5em;font-weight:500;text-decoration:none;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.link-arrow .i{transition:transform .2s var(--ease)}
.link-arrow:hover .i,a:hover>.link-arrow .i{transform:translateX(4px)}
[dir="rtl"] .link-arrow:hover .i,[dir="rtl"] a:hover>.link-arrow .i{transform:scaleX(-1) translateX(4px)}
.linkbtn{background:none;border:0;padding:0;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:.5em;min-height:40px;padding:0 1em;border-radius:999px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:.92rem;transition:background-color .2s,border-color .2s}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ---- small pieces ---- */
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--brand));flex:none;display:inline-block}
.dot.sq{border-radius:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-block:12px}
.tag{display:inline-flex;align-items:center;gap:.45em;padding:.2em .75em;border-radius:999px;border:1px solid var(--line);font-size:.82rem;line-height:1.6;color:var(--muted);background:transparent}
.demo{display:inline-block;margin-inline-start:.6em;padding:0 .5em;border:1px dashed var(--muted);border-radius:4px;font:400 .68rem/1.7 var(--mono);color:var(--muted);vertical-align:middle;font-weight:400}
.crumbs{display:flex;flex-wrap:wrap;gap:.6em;font-size:.82rem;color:var(--muted);margin-bottom:20px}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.checks{display:grid;gap:12px}.checks li{display:flex;gap:12px;align-items:flex-start}.checks .i{color:var(--accent);margin-top:.3em}
.social{display:flex;flex-wrap:wrap;gap:8px}
.social a{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;transition:background-color .2s,border-color .2s}
.social a:hover{border-color:var(--fg);background:color-mix(in oklab,var(--fg) 8%,transparent)}
.social-lg a{width:56px;height:56px}.social-lg .i{width:1.5em;height:1.5em}
.caret{display:inline-block;width:.5em;height:1.1em;margin-inline-start:3px;vertical-align:-.2em;background:var(--accent);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* media placeholder: designed to be replaced, never to pass as a real photo */
.ph{position:relative;display:grid;place-items:center;overflow:hidden;border-radius:var(--r);color:var(--muted);isolation:isolate;
  background:color-mix(in oklab,var(--fg) 8%,var(--bg))}
.ph::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,transparent 0 11px,color-mix(in oklab,var(--fg) 7%,transparent) 11px 12px)}
.ph .i{width:34px;height:34px;opacity:.5}
.ph-l{position:absolute;inset-inline-start:12px;inset-block-end:9px;inset-inline-end:12px;font:400 .7rem/1.4 var(--sans,var(--font));opacity:.85}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-wide{width:100%}
.ph-on-blue{background:rgba(255,255,255,.14);color:rgba(255,255,255,.9)}
.ph-on-blue::before{background:repeating-linear-gradient(135deg,transparent 0 11px,rgba(255,255,255,.12) 11px 12px)}

.empty{display:grid;gap:14px;justify-items:start;padding:clamp(28px,5vw,64px);border:1.5px dashed var(--line);border-radius:12px}
.empty-big{justify-items:center;text-align:center;margin-inline:auto;max-width:44rem}
.empty-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent)}
.empty-ic .i{width:26px;height:26px}

/* reveal: used sparingly, once, never looped */
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--i,0) * 90ms)}
.rv.in{opacity:1;transform:none}

/* ---- forms ---- */
.field{display:grid;gap:6px}
.field>label,.lbl{font-weight:500;font-size:.95rem}
.in{width:100%;min-height:50px;padding:.65em 1em;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 25%,transparent)}
.in[aria-invalid="true"]{border-color:#D6453D}
textarea.in{min-height:100px;resize:vertical}
.err-msg{color:#C93A32;font-size:.86rem;min-height:1.3em}
.tone-ink .err-msg,.tone-deep .err-msg{color:#FF8F86}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.choice{position:relative;display:block}
.choice input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.choice span{display:flex;align-items:center;justify-content:center;min-height:50px;padding:.5em 1em;border:1.5px solid var(--line);border-radius:10px;text-align:center;transition:border-color .15s,background-color .15s}
.choice input:checked+span{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,transparent);font-weight:500}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:18px;width:100%}

/* ---- navigation ---- */
.nav{position:fixed;inset:0 0 auto 0;z-index:60;--navh:var(--hh);height:var(--navh);padding-top:env(safe-area-inset-top,0px);color:var(--fg);transition:background-color .25s,box-shadow .25s,height .25s}
.nav.compact{--navh:calc(60px + env(safe-area-inset-top,0px))}
.nav.solid{background:var(--bg);box-shadow:0 1px 0 var(--line)}
.nav-in{height:100%;max-width:1440px;margin-inline:auto;padding-inline:var(--gut);display:flex;align-items:center;gap:18px}
.brand{display:inline-flex;align-items:center;gap:.3em;text-decoration:none;font-size:1.15rem;direction:ltr;color:inherit;flex:none}
.brand b{font-weight:600}.brand span:not(.brand-mark){font-weight:300}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;margin-inline-end:8px;border-radius:7px;background:var(--brand);color:#fff;font:500 .68rem/1 var(--mono)}
.cel-badge{display:inline-flex;align-items:center;padding:.1em .8em;border:1px solid var(--line);border-radius:999px;font-size:.8rem;white-space:nowrap}
.cel-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#F5C969;margin-inline-end:.55em}
.nav-links{display:flex;justify-content:center;flex:1;gap:2px}
.nav-links a{padding:.45em .8em;font-size:.94rem;text-decoration:none;border-radius:8px;opacity:.85;transition:opacity .2s,background-color .2s}
.nav-links a:hover{opacity:1;background:color-mix(in oklab,currentColor 8%,transparent)}
.nav-links a[aria-current="page"]{opacity:1;box-shadow:inset 0 -2px 0 var(--accent)}
.nav-tools{display:flex;align-items:center;gap:6px;margin-inline-start:auto;flex:none}
.lang-btn{padding-inline:10px}.lang-btn span{font-size:.85rem;font-weight:500}
.nav-burger{display:none}
@media (max-width:1119px){
  .nav-links,.nav-tools .lang-btn,.nav-tools [data-theme-toggle]{display:none}
  .nav-burger{display:inline-flex}
}
@media (max-width:420px){.nav-in{gap:10px}.nav-cta{padding:0 .9em;font-size:.86rem}.cel-badge{display:none}}

.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(4,10,18,.64)}
.menu-modal{place-items:stretch;padding:0;background:var(--ink)}
.menu-in{min-height:100%;display:flex;flex-direction:column;gap:24px;padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gut) calc(env(safe-area-inset-bottom,0px) + 24px)}
.menu-top{display:flex;justify-content:space-between;align-items:center;min-height:56px}
.menu-links{display:grid;margin-block:auto}
.menu-links a{padding:.35em 0;font-size:clamp(1.6rem,6.5vw,2.3rem);font-weight:500;text-decoration:none;border-bottom:1px solid var(--line)}
.menu-links a[aria-current="page"]{color:var(--accent)}
.menu-foot{display:grid;gap:16px}

.sticky-cta{display:none;position:fixed;inset-inline:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:45;transform:translateY(160%);transition:transform .3s var(--ease)}
.sticky-cta .btn{width:100%;box-shadow:0 10px 28px rgba(0,0,0,.3)}
@media (max-width:860px){.sticky-cta{display:block}.sticky-cta.on{transform:none}}

/* ---- footer ---- */
.foot{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px;padding-block:72px calc(40px + env(safe-area-inset-bottom,0px))}
.foot-brand{display:grid;gap:14px;align-content:start}
.foot-tag{color:var(--accent);font-size:.85rem}
.foot-col{display:grid;gap:10px;align-content:start}
.foot-col a{text-decoration:none;opacity:.85}.foot-col a:hover{opacity:1;text-decoration:underline}
.foot-col .social a{opacity:1}
.foot-legal{grid-column:1/-1;padding-top:28px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}
.cel-pick{display:grid;gap:6px;margin-top:12px;font-size:.78rem;color:var(--muted)}
.cel-pick .in{min-height:40px;padding:.3em .7em}
@media (max-width:860px){.foot{grid-template-columns:1fr 1fr;padding-bottom:96px}.foot-brand{grid-column:1/-1}}

/* ---- celebration layer: optional, subtle, never replaces the brand ---- */
.cel{position:absolute;top:calc(var(--hh) - 6px);inset-inline-end:clamp(12px,5vw,72px);width:clamp(90px,12vw,160px);color:#F5C969;opacity:.88;pointer-events:none;z-index:5}
.cel svg{display:block;width:100%;height:auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:14px;opacity:0;animation:fall 2.8s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),105vh) rotate(calc(var(--r) + 540deg))}}

/* ---- booking dialog ---- */
.sheet{position:relative;width:min(620px,100%);max-height:calc(100vh - 32px);max-height:calc(100svh - 32px);overflow:auto;border-radius:16px;padding:clamp(24px,4vw,40px);background:var(--bg);color:var(--fg)}
.sheet-x{position:absolute;inset-block-start:10px;inset-inline-end:10px}
.bk-prog{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:18px 44px 8px 0;margin-inline:0 44px}
.bk-prog span{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bk-prog i{display:block;height:100%;background:var(--grow);transform:scaleX(0);transform-origin:100% 50%;transition:transform .35s var(--ease)}
[dir="ltr"] .bk-prog i{transform-origin:0 50%}
.bk-count{font-size:.8rem;color:var(--muted);margin-bottom:18px}
.bk-step{display:grid;gap:16px}
.bk-step[hidden]{display:none}
.bk-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.bk-nav .btn-solid{margin-inline-start:auto}
.bk-fail{margin-top:8px}
.bk-done{display:grid;gap:18px;justify-items:start;outline:none}
.done-ic{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--grow);color:#2A1A00}
.done-ic .i{width:30px;height:30px;stroke-width:2.4}
.demo-note{font-size:.76rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px}
@media (max-width:640px){.modal:not(.menu-modal){place-items:end stretch;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:94vh;max-height:94svh;width:100%}}

/* ---- guide cover (typographic, CSS only; real covers replace it) ---- */
.cover{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:3/4;width:100%;padding:9cqw;overflow:hidden;border-radius:4px}
.cover-img{padding:0;object-fit:cover}
.cv-blue{background:#0074D9;color:#fff}
.cv-ink{background:#0D1A2A;color:#EAF0F8;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.cv-slate{background:#2E4A66;color:#fff}
.cv-brand,.cv-tag{position:relative;font-size:4.2cqw;opacity:.85}
.cv-glyph{position:absolute;inset-inline-end:-3cqw;top:18cqw;font:500 44cqw/1 var(--mono);opacity:.14;direction:ltr}
.cv-title{position:relative;font-size:12cqw;line-height:1.25;font-weight:600}
.cover::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3.4cqw;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.08) 60%,transparent)}
[dir="rtl"] .cover::after{background:linear-gradient(270deg,rgba(0,0,0,.3),rgba(255,255,255,.08) 60%,transparent)}

/* ---- document reader ---- */
#reader{padding:0;background:rgba(4,10,18,.86)}
.rd-shell{width:min(1100px,100%);height:min(96vh,920px);height:min(96svh,920px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;border-radius:14px;overflow:hidden}
.rd-bar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
.rd-title{flex:1;font-size:1.05rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-tools{display:flex;align-items:center;gap:2px}
.rd-z{min-width:3.4em;text-align:center;font-size:.8rem}
.rd-stage{overflow:auto;display:flex;justify-content:safe center;align-items:flex-start;padding:28px;background:color-mix(in oklab,var(--bg) 82%,#000)}
.rd-stage:focus{outline:none}
.rd-page{flex:none;container-type:inline-size;width:calc(min(520px,84vw) * var(--z,1));aspect-ratio:3/4;background:#fff;color:#14202e;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.45);overflow:hidden;transition:width .2s var(--ease)}
.rd-page img{width:100%;height:100%;object-fit:contain;display:block}
.rd-page .cover{height:100%;aspect-ratio:auto;border-radius:0}
.rd-toc,.rd-sec{height:100%;padding:11cqw;display:grid;align-content:start;gap:6cqw}
.rd-toc h3{font-size:7cqw}.rd-toc ol{display:grid;gap:3cqw;list-style:decimal;padding-inline-start:6cqw;font-size:4.6cqw}
.rd-sec{align-content:center}.rd-sec .mono{color:#0074D9;font-size:5cqw}.rd-sec h3{font-size:9cqw;line-height:1.3}.rd-sec p{font-size:3.8cqw;color:#5A6B7D;line-height:1.9}
.rd-nav{display:flex;justify-content:center;align-items:center;gap:20px;padding:8px;border-top:1px solid var(--line)}
.rd-nav .mono{min-width:5em;text-align:center;font-size:.85rem}
/* =====================================================================
   SIGNATURE INTERACTION (scoped to .sig; visuals unchanged from the approved prototype)
   ===================================================================== */
.sig{position:relative;height:560vh;height:560svh}
.sig .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.sig .grid{height:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,72px);align-items:center;padding:var(--hh) var(--gut) 92px;max-width:1440px;margin-inline:auto}
.sig .copy{display:grid}
.sig .ch{grid-area:1/1;align-self:center;will-change:opacity,transform}
.sig .ch h1,.sig .ch h2{margin:0 0 .45em;font-weight:600;font-size:clamp(2.3rem,4.9vw,4.5rem);line-height:1.3;text-wrap:balance}
[lang="en"] .sig .ch h1,[lang="en"] .sig .ch h2{line-height:1.12;letter-spacing:-.015em}
.sig .ch p{max-width:26em;font-size:clamp(1.05rem,1.5vw,1.3rem);line-height:1.95;color:var(--muted)}
.sig .cta{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.sig .visual{display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0}
.sig .win{position:relative;display:flex;flex-direction:column;direction:ltr;height:min(62vh,560px);height:min(62svh,560px);
  border:1px solid color-mix(in oklab,var(--line) calc(var(--chrome) * 100%),transparent);
  background:color-mix(in oklab,var(--win) calc(var(--chrome) * 100%),transparent);border-radius:16px;overflow:hidden;container-type:inline-size}
.sig .bar{position:relative;flex:none;height:calc(38px * var(--chrome));opacity:var(--chrome);border-bottom:1px solid var(--line);overflow:hidden}
.sig .tabs{position:absolute;inset:0 auto 0 8px;display:flex;align-items:flex-end;gap:2px;opacity:calc(1 - var(--url))}
.sig .tab{display:inline-block;overflow:hidden;white-space:nowrap;font:400 12px/1 var(--mono);padding:9px 12px;border-radius:8px 8px 0 0;color:var(--muted)}
.sig .tab.on{color:var(--fg);background:var(--bg)}
.sig .tab.more:nth-child(2){max-width:calc(9em * var(--tabs));opacity:var(--tabs);padding-inline:calc(12px * var(--tabs))}
.sig .tab.more:nth-child(3){max-width:calc(7em * var(--tabs));opacity:var(--tabs);padding-inline:calc(12px * var(--tabs))}
.sig .url{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(58%,330px);height:24px;border-radius:999px;background:color-mix(in oklab,var(--fg) 8%,transparent);display:grid;place-items:center;font:400 12px/1 var(--mono);color:var(--fg);opacity:var(--url)}
.sig .pub{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg);opacity:0}
.sig .pub::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grow)}
.sig .body{flex:1;display:flex;min-height:0}
.sig .pane{position:relative;flex:0 0 calc(var(--frac) * 100%);overflow:hidden;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
.sig .lines{position:absolute;left:0;top:0;will-change:transform;font-family:var(--mono)}
.sig .ln{display:none;white-space:pre;line-height:1.75}
.sig .no{display:inline-block;width:calc(2.2em * var(--chrome));margin-right:calc(.7em * var(--chrome));overflow:hidden;text-align:right;color:var(--muted);opacity:.7;user-select:none}
.sig .t{color:var(--accent)}.sig .k{color:var(--prop)}.sig .s{color:var(--str)}.sig .x{color:var(--fg)}.sig .p{color:var(--muted)}
.sig .err{text-decoration:underline wavy var(--err);text-decoration-thickness:1.5px;text-underline-offset:.22em}
.sig .hint{position:absolute;left:14px;right:14px;bottom:12px;direction:rtl;text-align:right;font-size:12.5px;line-height:1.6;padding:8px 12px;border-radius:10px;opacity:0;transition:opacity .35s ease;background:color-mix(in oklab,var(--fg) 7%,transparent);color:var(--fg)}
.sig .hint.err{opacity:1;box-shadow:inset -3px 0 0 var(--err);text-decoration:none}
.sig .hint.ok{opacity:1;box-shadow:inset -3px 0 0 var(--str)}
[dir="ltr"] .sig .hint{direction:ltr;text-align:left}
[dir="ltr"] .sig .hint.err{box-shadow:inset 3px 0 0 var(--err)}
[dir="ltr"] .sig .hint.ok{box-shadow:inset 3px 0 0 var(--str)}
.sig .preview{position:relative;flex:1 1 0;min-width:0;opacity:var(--prev);border-left:1px solid color-mix(in oklab,var(--line) calc(var(--prev) * 100%),transparent)}
.sig .page{position:absolute;inset:12px;background:#fff;color:#14202e;border-radius:10px;overflow:hidden;container-type:size}
.sig .raw,.sig .site{position:absolute;inset:0}
.sig .raw{padding:6cqw 7cqw;font-family:"Times New Roman",Times,serif;color:#111;opacity:calc(1 - var(--site));line-height:1.3}
.sig .raw h1{margin:0 0 .5em;font-size:9cqw;line-height:1.15;font-weight:700;transition:color .5s ease}
.sig .raw.fixed h1{color:#0074d9}
.sig .raw ul{margin:0;padding-left:1.4em;list-style:disc;font-size:5.2cqw;line-height:1.5;opacity:0;transition:opacity .4s ease}
.sig .raw.on ul{opacity:1}
.sig .site{opacity:var(--site);padding:5cqw 6cqw;direction:rtl;font-family:var(--font);line-height:1.5}
[dir="ltr"] .sig .site{direction:ltr}
.sig .s-nav{display:flex;align-items:center;gap:3cqw;font-size:max(11px,2.7cqw);color:#4a5a6c}
.sig .s-nav b{margin-inline-end:auto;color:#14202e;font-weight:600;font-size:max(12px,3cqw)}
.sig .site h3{margin:5cqw 0 1cqw;font-size:max(18px,6.6cqw);line-height:1.3;font-weight:600}
.sig .site p{margin:0 0 4cqw;font-size:max(11px,3cqw);color:#4a5a6c}
.sig .s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5cqw}
.sig .s-tile{opacity:var(--v);transform:translateY(calc((1 - var(--v)) * 14px));display:grid;gap:1.6cqw;font-size:max(10px,2.5cqw);color:#14202e}
.sig .art{aspect-ratio:1/.8;border-radius:1.6cqw;padding:2cqw;display:grid;gap:1cqw}
.sig .a1{background:#E1F0FF;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr}
.sig .a1 i{border-radius:.8cqw;background:#0074d9;opacity:.9}.sig .a1 i:first-child{grid-column:1/-1}
.sig .a2{background:#FFF1D6;align-content:center}
.sig .a2 i{display:block;height:3.2cqw;border-radius:1cqw;background:#14202e;opacity:.78}
.sig .a2 i:nth-child(1){width:90%}.sig .a2 i:nth-child(2){width:62%}.sig .a2 i:nth-child(3){width:76%}
.sig .a3{background:#E2F5EC;position:relative}.sig .a3 i{position:absolute;border-radius:1.4cqw}
.sig .a3 i:nth-child(1){inset:18% 38% 22% 14%;background:#FFB43A}.sig .a3 i:nth-child(2){inset:30% 12% 12% 40%;background:#0074d9;opacity:.92}
.sig .term{flex:none;height:calc(56px * var(--term));overflow:hidden;display:flex;align-items:center;gap:.6em;padding:0 16px;border-top:1px solid var(--line);background:color-mix(in oklab,var(--bg) 78%,#000);font:400 13px/1 var(--mono);color:var(--fg);white-space:nowrap}
.sig .term .pr{color:var(--grow)}
.sig .term .ok{margin-left:auto;opacity:0;font-family:var(--font);font-size:13px;color:var(--str);direction:rtl}
[dir="ltr"] .sig .term .ok{direction:ltr}
.sig .chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;min-height:3.2rem;align-content:flex-start}
.sig .chips li{opacity:0;padding:.42em .95em;border-radius:999px;font-size:.88rem;line-height:1.4;border:1px solid var(--line);color:var(--fg)}
.sig .chips li.tech{font-family:var(--mono);font-size:.82rem;direction:ltr}
.sig .chips li.soft{background:color-mix(in oklab,var(--accent) 16%,transparent);border-color:transparent}
.sig .rail{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 40px));display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sig .rail button{appearance:none;background:none;border:0;padding:0;cursor:pointer;text-align:start;color:var(--muted);font:400 .8rem/1.4 var(--font)}
.sig .seg{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:8px}
.sig .fill{display:block;height:100%;background:var(--grow);transform:scaleX(0);transform-origin:100% 50%}
[dir="ltr"] .sig .fill{transform-origin:0 50%}
.sig .rail button[aria-current="step"]{color:var(--fg)}
@media (max-width:860px){
  .sig .grid{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start;gap:14px;padding:calc(var(--hh) + 6px) 20px 76px}
  .sig .ch h1,.sig .ch h2{font-size:clamp(1.9rem,8.2vw,2.5rem);margin-bottom:.3em}
  .sig .ch p{font-size:1rem;line-height:1.8}
  .sig .cta{margin-top:1.1rem}
  .sig .btn.lg{min-height:46px;padding:0 1.3em;font-size:.95rem}
  .sig .visual{gap:10px;align-self:stretch}
  .sig .win{height:min(42vh,360px);height:min(42svh,360px)}
  .sig .chips{min-height:2.6rem;gap:6px}.sig .chips li{font-size:.78rem;padding:.3em .75em}
  .sig .rail .lb{visibility:hidden}.sig .rail button[aria-current="step"] .lb{visibility:visible}
}

/* =====================================================================
   HOMEPAGE CHAPTERS
   ===================================================================== */
/* 02 why */
.why-grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:start}
.why-copy{display:grid;gap:28px}
.why-list{margin-top:12px}
.why-list li{display:grid;grid-template-columns:minmax(0,11rem) 1fr;gap:20px;padding:18px 0;border-top:1px solid var(--line)}
.why-list strong{font-weight:500}.why-list span{color:var(--muted)}
.why-media{grid-column:1/-1;margin-top:clamp(16px,3vw,40px)}
.diff{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--win)}
.diff-cap{display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line)}
.dpair{border-top:1px solid var(--line)}.diff-cap+.dpair{border-top:0}
.dl{display:grid;grid-template-columns:2.2rem 1fr;align-items:baseline;padding:10px 16px;font-size:1rem}
.dl b{font:500 1rem var(--mono);text-align:center}
.del{color:var(--muted);background:color-mix(in oklab,#E5484D 8%,transparent)}
.del>span{text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--fg) 40%,transparent)}
.add{background:color-mix(in oklab,var(--accent) 12%,transparent)}.add b{color:var(--accent)}
.diff-light{max-width:44rem}

/* 03 path */
.cat-filter{display:flex;flex-wrap:wrap;gap:8px;margin:44px 0 36px}
.stages{display:grid;grid-template-columns:repeat(var(--n),minmax(210px,1fr));overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;margin-top:24px}
.cat-filter+.stages{margin-top:0}
.stage{position:relative;--off:calc((var(--n) - 1 - var(--i)) * 34px);padding-top:calc(30px + var(--off));padding-inline-end:24px;scroll-snap-align:start}
.stage::before{content:"";position:absolute;inset-inline:0;top:calc(var(--off) + 8px);height:2px;background:var(--line)}
.stage::after{content:"";position:absolute;inset-inline-end:0;top:calc(var(--off) - 26px);height:34px;width:2px;background:var(--line)}
.stage:last-child::after{display:none}
.st-pin{position:absolute;top:var(--off);inset-inline-start:0;width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.st-name{font-size:1.5rem;font-weight:600;line-height:1.3}
.st-desc{color:var(--muted);font-size:.9rem;line-height:1.7;margin-top:2px}
.nodes{display:grid;gap:8px;margin-top:18px}
.node a{display:flex;align-items:center;gap:.65em;padding:.6em .85em;border:1px solid var(--line);border-radius:8px;text-decoration:none;background:var(--bg);transition:border-color .2s,transform .2s var(--ease)}
.node a:hover{border-color:var(--accent);transform:translateY(-2px)}
.node.extra a{border-style:dashed}
.node .i{margin-inline-start:auto;opacity:.6}
.node{transition:opacity .25s}.node.dim{opacity:.22}
.path-cta{margin-top:48px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
@media (max-width:860px){
  .stages{display:block;overflow:visible}
  .stage{--off:0px;padding:0 0 32px;padding-inline-start:36px}
  .stage::before{inset-inline:auto;inset-inline-start:8px;top:20px;bottom:-4px;width:2px;height:auto}
  .stage::after{display:none}
  .st-pin{top:2px}
}

/* 04 doing */
.steps{position:relative;display:grid;gap:clamp(56px,9vw,120px);margin-top:72px;padding-inline-start:clamp(28px,5vw,64px)}
.steps-line{position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:rgba(255,255,255,.24);border-radius:2px}
.steps-line i{display:block;width:100%;height:calc(var(--p,0) * 100%);background:var(--grow);border-radius:2px}
.step{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,72px);align-items:center}
.step.flip .step-txt{order:2}
.step-t{font-size:clamp(2.2rem,5vw,4rem);font-weight:600;line-height:1.25;margin-bottom:.2em}
.step p{max-width:26em;color:rgba(255,255,255,.9);font-size:1.1rem}
.step-code{display:inline-block;margin-top:18px;padding:.3em .8em;border-radius:6px;background:rgba(255,255,255,.16);font-size:.9rem}

/* 05 people */
.people-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,5vw,80px);align-items:start;margin-top:56px}
.feat{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,3vw,40px);text-decoration:none;align-items:end}
.feat-pic .ph{width:100%}
.feat-name{font-size:clamp(2rem,4vw,3.3rem);line-height:1.25;font-weight:600;margin:.15em 0 .3em}
.role{font-size:.9rem;color:var(--muted)}
.minis{display:grid;gap:20px}
.mini{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center;text-decoration:none;padding-bottom:20px;border-bottom:1px solid var(--line)}
.mini-pic .ph{aspect-ratio:1/1}
.mini-tx{display:grid;gap:2px}.mini-tx small{color:var(--muted)}.mini-tx .tags{margin-block:6px 0}
.teaches{font-size:.92rem}.teaches a{text-underline-offset:3px}

/* 06 community */
.mosaic{columns:3 280px;column-gap:16px;margin-top:56px}
.m{break-inside:avoid;margin:0 0 16px}
.m .ph{aspect-ratio:4/5}.m:nth-child(3n+2) .ph{aspect-ratio:1/1}.m:nth-child(3n) .ph{aspect-ratio:4/3}.m:nth-child(1) .ph{aspect-ratio:3/4}
.m figcaption{display:grid;padding:10px 2px 0}.m figcaption b{font-size:.82rem;color:var(--accent);font-weight:500}.m figcaption span{font-weight:600;font-size:1.1rem}

/* 07 stories */
.stories-body{display:grid;grid-template-columns:minmax(0,8fr) minmax(0,4fr);gap:clamp(24px,4vw,56px);margin-top:48px;align-items:start}
.film{position:relative}.film .ph{aspect-ratio:16/9}
.film video{width:100%;aspect-ratio:16/9;border-radius:6px;background:#000;display:block}
.play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;pointer-events:none}
.play .i{width:30px;height:30px}
.film-meta{display:grid;gap:8px;margin-top:20px}
.quote{font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.6;font-weight:300}
.quote.is-empty{color:var(--muted);font-style:italic}
.who b{font-weight:600}.prog a{color:var(--accent)}.ach{color:var(--muted)}
.story-list{display:grid;gap:10px}
.story-btn{width:100%;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;text-align:start;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;transition:border-color .2s,background-color .2s}
.story-btn[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 10%,transparent)}
.story-th .ph{aspect-ratio:16/10}
.story-tx{display:grid}.story-tx small{color:var(--muted)}

/* 08 library */
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,4vw,64px);align-items:end;margin-top:56px}
.book{display:grid;gap:24px;align-content:end}
.book:nth-child(2){padding-bottom:clamp(0px,3vw,40px)}
.book-cover{display:block;container-type:inline-size;width:min(100%,280px);margin-inline:auto;filter:drop-shadow(0 20px 26px rgba(8,19,33,.28));
  transform:perspective(900px) rotateY(var(--tilt,8deg));transition:transform .4s var(--ease)}
[dir="ltr"] .book-cover{--tilt:-8deg}
.book-cover:hover,.book-cover:focus-visible{transform:perspective(900px) rotateY(0)}
.book-info{display:grid;gap:10px;justify-items:start}
.book-info h3 a{text-decoration:none}.book-info p{color:var(--muted)}
.meta{font-size:.78rem}
.book-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.shelf-page{margin-top:0}
@media (max-width:860px){
  .shelf{grid-template-columns:1fr;gap:40px}
  .book{grid-template-columns:132px 1fr;gap:20px;align-items:center}.book-cover{width:132px;margin:0}.book:nth-child(2){padding-bottom:0}
}

const focusables = root => $$('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', root).filter(el => el.offsetParent !== null || el === document.activeElement);
function openModal(el, { onClose, labelledby } = {}) {
  const opener = document.activeElement;
  el.hidden = false; document.documentElement.classList.add('lock');
  const onKey = e => {
    if (e.key === 'Escape') { e.stopPropagation(); close(); return; }
    if (e.key !== 'Tab') return;
    const f = focusables(el); if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };
  function close() {
    el.hidden = true; document.removeEventListener('keydown', onKey, true);
    if (!$$('.modal').some(m => !m.hidden)) document.documentElement.classList.remove('lock');
    onClose && onClose(); opener && opener.focus && opener.focus();
  }
  document.addEventListener('keydown', onKey, true);
  requestAnimationFrame(() => { const f = el.querySelector('[data-autofocus]') || focusables(el)[0]; f && f.focus(); });
  return close;
}

  const esc2 = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const caret = Object.assign(document.createElement('span'), { className: 'caret' });
  lines.forEach((ln, i) => {
    ln.row = document.createElement('div'); ln.row.className = 'ln';
    const no = document.createElement('span'); no.className = 'no'; no.textContent = i + 1;
    ln.code = document.createElement('span');
    ln.row.append(no, ln.code); linesEl.appendChild(ln.row);
  });

  let W = 0, H = 0, mobile = false, destroyed = false;
  function measure() { const r = win.getBoundingClientRect(); W = r.width; H = r.height; mobile = matchMedia('(max-width: 860px)').matches; schedule(); }

  function renderLines(p, intro) {
    let vis = 0, last = -1;
    lines.forEach((ln, i) => {
      const segs = typeof ln.segs === 'function' ? ln.segs(p) : ln.segs;
      const total = segs.reduce((n, s) => n + s[1].length, 0);
      const f = i === 0 ? Math.max(intro, ss(0, .03, p)) : prog(ln.at, ln.at + ln.dur, p);
      const n = Math.round(f * total);
      const key = n + '|' + (ln.variant ? ln.variant(p) : 0);
      if (ln._key !== key) {
        ln._key = key;
        let left = n, html = '';
        for (const [c, tx] of segs) { if (left <= 0) break; const part = tx.slice(0, left); left -= part.length; html += '<span class="' + c + '">' + esc2(part) + '</span>'; }
        ln.code.innerHTML = html; ln.row.style.display = n > 0 ? 'flex' : 'none';
      }
      if (n > 0) { vis++; last = i; }
    });
    if (last >= 0 && lines[last].code.lastChild !== caret) lines[last].code.appendChild(caret);
    return vis;
  }

  let hintState = '', lastActive = -1, fixedOn = null, listOn = null;
  const cmd = 'git push origin main';
  const HINT_ERR = L('خطأ: لا توجد خاصية اسمها colr. هل تقصد color؟', 'Error: there is no property called colr. Did you mean color?');
  const HINT_OK = L('تم الإصلاح. الصفحة تعمل الآن.', 'Fixed. The page works now.');

  function render(p, intro) {
    const d = ss(.18, .55, p), s1 = ss(.06, .24, p), s3 = ss(.48, .62, p), s4 = ss(.76, .88, p);
    const chrome = ss(.08, .22, p), frac = 1 - .44 * s1 - .30 * s3 - .26 * s4, term = ss(.82, .88, p), url = ss(.78, .86, p);
    const vars = { '--d': d, '--chrome': chrome, '--frac': frac, '--prev': ss(.10, .22, p), '--site': ss(.50, .58, p), '--tabs': ss(.50, .58, p),
      '--url': url, '--term': term, '--t1': ss(.58, .62, p), '--t2': ss(.63, .67, p), '--t3': ss(.68, .72, p),'--skill': ss(.82, .88, p)  };
    for (const k in vars) docEl.style.setProperty(k, vars[k].toFixed(4));

    const vis = renderLines(p, intro);
    const barH = 38 * chrome, termH = 56 * term, bodyH = H - barH - termH, paneW = W * frac;
    const fsBig = Math.min(W * .062, 56), fsMid = mobile ? 13 : 15, fs3 = mobile ? 11 : 12;
    const fs = lerp(lerp(fsBig, fsMid, s1), fs3, s3);
    linesEl.style.fontSize = fs.toFixed(2) + 'px';
    const lh = fs * 1.75, contentH = vis * lh, padX = mobile ? 12 : 18, padY = mobile ? 12 : 16, reserve = lerp(0, 46, s1);
    const x = lerp((paneW - 13.2 * fs) / 2, padX, s1), yC = (bodyH - contentH) / 2, yT = Math.min(padY, bodyH - reserve - contentH);
    linesEl.style.transform = 'translate(' + x.toFixed(1) + 'px,' + lerp(yC, yT, s1).toFixed(1) + 'px)';

    const hs = (p >= .305 && p < FIX) ? 'err' : (p >= FIX && p < .47) ? 'ok' : '';
    if (hs !== hintState) { hintState = hs; if (hs === 'err') hint.textContent = HINT_ERR; if (hs === 'ok') hint.textContent = HINT_OK; hint.className = 'hint ' + hs; }
    const fx = p >= FIX, ls = p >= .43;
    if (fx !== fixedOn) { fixedOn = fx; raw.classList.toggle('fixed', fx); }
    if (ls !== listOn) { listOn = ls; raw.classList.toggle('on', ls); }

    cmdEl.textContent = cmd.slice(0, Math.round(prog(.835, .885, p) * cmd.length));
    okEl.style.opacity = ss(.89, .92, p).toFixed(3);
    pubEl.style.opacity = ss(.90, .94, p).toFixed(3);
    chips.forEach((c, i) => { const o = ss(.86 + i * .014, .90 + i * .014, p); c.style.opacity = o.toFixed(3); c.style.transform = reduce ? 'none' : 'translateY(' + ((1 - o) * 8).toFixed(1) + 'px)'; });

    const w = .035;
    chEls.forEach((el, i) => {
      const inn = i === 0 ? 1 : ss(B[i - 1], B[i - 1] + w, p), out = i === 3 ? 1 : 1 - ss(B[i] - w, B[i], p), o = inn * out;
      el.style.opacity = o.toFixed(3);
      el.style.transform = reduce ? 'none' : 'translateY(' + ((1 - o) * 18 * (p < CENTER[i] ? 1 : -1)).toFixed(1) + 'px)';
      const hide = o < .5;
      if (el._hide !== hide) { el._hide = hide; el.inert = hide; el.setAttribute('aria-hidden', hide); }
    });

    const active = p < B[0] ? 0 : p < B[1] ? 1 : p < B[2] ? 2 : 3;
    SEG.forEach(([a, b], i) => { fills[i].style.transform = 'scaleX(' + prog(a, b, p).toFixed(3) + ')'; });
    if (active !== lastActive) { lastActive = active; railBtns.forEach((b, i) => (i === active ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'))); }
  }

  let target = 0, cur = 0, intro = reduce ? 1 : 0, raf = 0;
  const t0 = performance.now();
  function readTarget() { const max = root.offsetHeight - stage.offsetHeight; target = max > 0 ? clamp(-root.getBoundingClientRect().top / max) : 0; }
  function frame(now) {
    raf = 0; if (destroyed) return;
    if (!reduce && intro < 1) intro = prog(600, 1900, now - t0);
    const diff = target - cur; cur = (reduce || Math.abs(diff) < .0003) ? target : cur + diff * .14;
    render(cur, intro);
    if (Math.abs(target - cur) > .0003 || intro < 1) schedule();
  }
  function schedule() { if (!raf && !destroyed) raf = requestAnimationFrame(frame); }
  function onScroll() { readTarget(); if (intro < 1 && target > .02) intro = 1; schedule(); }
  const onResize = () => { measure(); onScroll(); };
  const ro = new ResizeObserver(measure); ro.observe(win);
  addEventListener('scroll', onScroll, { passive: true }); addEventListener('resize', onResize);

  function go(i) {
    const max = root.offsetHeight - stage.offsetHeight, top = root.getBoundingClientRect().top + scrollY;
    scrollTo({ top: top + ANCHOR[i] * max, behavior: reduce ? 'auto' : 'smooth' });
  }
  const onClick = e => { const b = e.target.closest('[data-go]'); if (b && root.contains(b)) go(+b.dataset.go); };
  root.addEventListener('click', onClick);

  measure(); readTarget(); cur = target; if (target > .02) intro = 1; render(cur, intro); schedule();

  return {
    destroy() {
      destroyed = true; cancelAnimationFrame(raf); ro.disconnect();
      removeEventListener('scroll', onScroll); removeEventListener('resize', onResize); root.removeEventListener('click', onClick);
      VARS.forEach(v => docEl.style.removeProperty(v));
    }
  };
}

function coverHTML(g) {
  if (g.cover) return `<img class="cover cover-img" src="${esc(g.cover)}" alt="" loading="lazy" decoding="async">`;

    <strong class="cv-title">${T(g.title)}</strong><span class="cv-tag mono">${esc(CMS.settings.tagline)}</span></div>`;
}
function guideMeta(g) {
  const bits = [];
  if (g.pageCount) bits.push(L(`${g.pageCount} صفحة`, `${g.pageCount} pages`));
  if (g.language) bits.push(g.language === 'ar' ? 'العربية' : g.language === 'en' ? 'English' : esc(g.language));
  return bits.length ? `<p class="meta mono">${bits.join('  /  ')}</p>` : '';
}
function downloadBtn(g, cls = 'btn-ghost sm') {

/* =====================================================================
   BOOKING — public, three short steps, progressive disclosure.
   With settings.booking.endpoint = null it runs frontend-only: the visitor
   can finish via a prefilled WhatsApp message. Set an endpoint and it POSTs JSON.
   ===================================================================== */
const Book = { close: null, step: 0, data: {}, opts: {} };
const PHONE_RE = /^(\+?20|0)?1[0125]\d{8}$/;
const cleanPhone = v => String(v || '').replace(/[\s\-()]/g, '');

function bookingHTML() {
  const cs = vis(CMS.courses), brs = vis(CMS.branches), cats = vis(CMS.categories);
  const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${l}</option>`;
  const courseOpts = cats.map(k => { const items = cs.filter(c => c.cat === k.id); return items.length ? `<optgroup label="${esc(t(k.label))}">${items.map(c => opt(c.slug, T(c.title), Book.opts.course === c.slug)).join('')}</optgroup>` : ''; }).join('')
    + cs.filter(c => !cats.some(k => k.id === c.cat)).map(c => opt(c.slug, T(c.title), Book.opts.course === c.slug)).join('');
  const choice = (name, v, label) => `<label class="choice"><input type="radio" name="${name}" value="${esc(v)}"><span>${label}</span></label>`;
  return `<div class="sheet tone-paper" role="dialog" aria-modal="true" aria-labelledby="bk-title">
    <button class="icon-btn sheet-x" type="button" data-close aria-label="${esc(L('إغلاق', 'Close'))}">${ico('close')}</button>
    <div class="bk-prog" aria-hidden="true"><span><i></i></span><span><i></i></span><span><i></i></span></div>
    <p class="bk-count mono" id="bk-count" aria-live="polite"></p>
    <form id="bk-form" novalidate>
      <fieldset class="bk-step" data-step="0"><legend><h2 class="h2" id="bk-title">${L('عرّفنا بنفسك', 'Tell us about yourself')}</h2></legend>
        <div class="field"><label for="bk-name">${L('الاسم بالكامل', 'Full name')}</label><input class="in" id="bk-name" name="name" autocomplete="name" data-autofocus><p class="err-msg" id="bk-name-e"></p></div>
        <div class="field"><label for="bk-age">${L('السن', 'Age')}</label><input class="in" id="bk-age" name="age" type="number" inputmode="numeric" min="3" max="99"><p class="err-msg" id="bk-age-e"></p></div>
        <div class="field"><label for="bk-phone">${L('رقم الموبايل', 'Mobile number')}</label><input class="in mono" id="bk-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX"><p class="err-msg" id="bk-phone-e"></p></div>
        <label class="check"><input type="checkbox" id="bk-wa-same" checked><span>${L('نفس الرقم على WhatsApp', 'Same number on WhatsApp')}</span></label>
        <div class="field" id="bk-wa-wrap" hidden><label for="bk-wa">${L('رقم WhatsApp', 'WhatsApp number')}</label><input class="in mono" id="bk-wa" name="whatsapp" type="tel" inputmode="tel"><p class="err-msg" id="bk-wa-e"></p></div>
      </fieldset>
      <fieldset class="bk-step" data-step="1" hidden><legend><h2 class="h2">${L('عايز تتعلّم إيه؟', 'What would you like to learn?')}</h2></legend>
        <div class="field"><label for="bk-course">${L('الكورس', 'Course')}</label><select class="in" id="bk-course" name="course"><option value="">${L('مش متأكد، محتاج ترشيح', 'Not sure yet, I need a suggestion')}</option>${courseOpts}</select></div>
        <div class="field"><label for="bk-branch">${L('الفرع', 'Branch')}</label><select class="in" id="bk-branch" name="branch">${brs.map((b, i) => opt(b.id, T(b.label), i === 0)).join('')}</select></div>
        <div class="field" role="radiogroup" aria-labelledby="bk-mode-l"><span class="lbl" id="bk-mode-l">${L('نمط التعلّم', 'Learning mode')}</span><div class="choice-grid">${vis(CMS.modes).map(m => choice('mode', m.id, T(m.label))).join('')}</div><p class="err-msg" id="bk-mode-e"></p></div>
      </fieldset>
      <fieldset class="bk-step" data-step="2" hidden><legend><h2 class="h2">${L('نتواصل معاك إزاي؟', 'How can we reach you?')}</h2></legend>
        <div class="field" role="radiogroup" aria-labelledby="bk-contact-l"><span class="lbl" id="bk-contact-l">${L('وسيلة التواصل المفضلة', 'Preferred contact method')}</span><div class="choice-grid">
          ${choice('contact', 'whatsapp', 'WhatsApp')}${choice('contact', 'call', L('مكالمة', 'Phone call'))}${choice('contact', 'email', L('بريد إلكتروني', 'Email'))}</div><p class="err-msg" id="bk-contact-e"></p></div>
        <div class="field" id="bk-email-wrap" hidden><label for="bk-email">${L('البريد الإلكتروني', 'Email')}</label><input class="in mono" id="bk-email" name="email" type="email" autocomplete="email"><p class="err-msg" id="bk-email-e"></p></div>
        <div class="field"><label for="bk-msg">${L('رسالة (اختياري)', 'Message (optional)')}</label><textarea class="in" id="bk-msg" name="message"></textarea></div>
      </fieldset>
      <p class="err-msg bk-fail" id="bk-fail" role="alert"></p>
      <div class="bk-nav"><button class="btn btn-ghost" type="button" id="bk-back">${L('رجوع', 'Back')}</button><button class="btn btn-solid" type="submit" id="bk-next">${L('التالي', 'Next')}</button></div>
    </form>
    <div class="bk-done" id="bk-done" hidden tabindex="-1"></div></div>`;
}

function openBooking(opts = {}) {
  Book.opts = opts; Book.step = 0; Book.data = {};
  const el = $('#book-modal'); el.innerHTML = bookingHTML();
  const f = $('#bk-form');
  if (opts.name) $('#bk-name').value = opts.name;
  const same = $('#bk-wa-same'), wrap = $('#bk-wa-wrap');
  same.addEventListener('change', () => { wrap.hidden = same.checked; });
  $$('input[name=contact]', f).forEach(r => r.addEventListener('change', () => { $('#bk-email-wrap').hidden = r.value !== 'email' || !r.checked; }));
  $('#bk-back').addEventListener('click', () => showStep(Book.step - 1));
  f.addEventListener('submit', e => { e.preventDefault(); next(); });
  el.onclick = e => { if (e.target === el || e.target.closest('[data-close]')) Book.close && Book.close(); };
  Book.close = openModal(el, { onClose() { Book.close = null; } });
  showStep(0);
}

function showStep(n) {
  Book.step = clamp(n, 0, 2);
  $$('.bk-step').forEach(s => { s.hidden = +s.dataset.step !== Book.step; });
  $$('.bk-prog i').forEach((b, i) => { b.style.transform = `scaleX(${i <= Book.step ? 1 : 0})`; });
  $('#bk-count').textContent = L(`الخطوة ${Book.step + 1} من 3`, `Step ${Book.step + 1} of 3`);
  $('#bk-back').hidden = Book.step === 0;
  $('#bk-next').textContent = Book.step === 2 ? L('أرسل طلبي', 'Send my request') : L('التالي', 'Next');
  const first = $(`.bk-step[data-step="${Book.step}"] input,.bk-step[data-step="${Book.step}"] select`); first && first.focus();
}

function setErr(id, msg) {
  const inp = $('#' + id), er = $('#' + id + '-e');
  if (er) er.textContent = msg || '';
  if (inp) { if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid'); if (er) inp.setAttribute('aria-describedby', id + '-e'); }
  return !msg;
}
function validate(step) {
  let ok = true; const v = id => ($('#' + id).value || '').trim();
  if (step === 0) {
    ok = setErr('bk-name', v('bk-name').length < 2 ? L('اكتب اسمك بالكامل.', 'Please enter your full name.') : '') && ok;
    const age = +v('bk-age'); ok = setErr('bk-age', !(age >= 3 && age <= 99) ? L('اكتب السن بالأرقام (من 3 إلى 99).', 'Enter your age in numbers (3 to 99).') : '') && ok;
    ok = setErr('bk-phone', !PHONE_RE.test(cleanPhone(v('bk-phone'))) ? L('اكتب رقم موبايل مصري صحيح، مثل 01012345678.', 'Enter a valid Egyptian mobile number, e.g. 01012345678.') : '') && ok;
    if (!$('#bk-wa-same').checked) ok = setErr('bk-wa', !PHONE_RE.test(cleanPhone(v('bk-wa'))) ? L('اكتب رقم WhatsApp صحيح.', 'Enter a valid WhatsApp number.') : '') && ok;
  }
  if (step === 1) { const m = $('input[name=mode]:checked'); const er = $('#bk-mode-e'); er.textContent = m ? '' : L('اختر نمط التعلّم.', 'Choose a learning mode.'); ok = !!m; }
  if (step === 2) {
    const c = $('input[name=contact]:checked'); $('#bk-contact-e').textContent = c ? '' : L('اختر وسيلة التواصل.', 'Choose how we should reach you.'); ok = !!c;
    if (c && c.value === 'email') ok = setErr('bk-email', !/^\S+@\S+\.\S+$/.test(v('bk-email')) ? L('اكتب بريدًا إلكترونيًا صحيحًا.', 'Enter a valid email address.') : '') && ok;
  }
  if (!ok) { const bad = $(`.bk-step[data-step="${step}"] [aria-invalid="true"]`) || $(`.bk-step[data-step="${step}"] input`); bad && bad.focus(); }
  return ok;
}

function bookingMessage(d) {
  const c = course(d.course), br = CMS.branches.find(b => b.id === d.branch), md = CMS.modes.find(m => m.id === d.mode);
  const how = { whatsapp: 'WhatsApp', call: L('مكالمة', 'phone call'), email: L('بريد إلكتروني', 'email') }[d.contact];
  return L(`مرحبًا Codera Tech، أنا ${d.name} (${d.age} سنة). أرغب في الحجز${c ? ' في كورس ' + t(c.title) : ' ومحتاج ترشيح للكورس المناسب'}.${br ? ' الفرع: ' + t(br.label) + '.' : ''}${md ? ' نمط التعلّم: ' + t(md.label) + '.' : ''} وسيلة التواصل المفضلة: ${how}. رقمي: ${d.phone}.${d.message ? ' ' + d.message : ''}`,
    `Hello Codera Tech, I am ${d.name} (${d.age} years old). I would like to book${c ? ' the ' + t(c.title) + ' course' : ' and need a suggestion for the right course'}.${br ? ' Branch: ' + t(br.label) + '.' : ''}${md ? ' Learning mode: ' + t(md.label) + '.' : ''} Preferred contact: ${how}. My number: ${d.phone}.${d.message ? ' ' + d.message : ''}`);
}

async function next() {
  if (!validate(Book.step)) return;
  if (Book.step < 2) return showStep(Book.step + 1);
  const g = id => ($('#' + id).value || '').trim();
  const d = { name: g('bk-name'), age: g('bk-age'), phone: cleanPhone(g('bk-phone')), whatsapp: $('#bk-wa-same').checked ? cleanPhone(g('bk-phone')) : cleanPhone(g('bk-wa')),
    course: g('bk-course'), branch: g('bk-branch'), mode: ($('input[name=mode]:checked') || {}).value, contact: ($('input[name=contact]:checked') || {}).value,
    email: g('bk-email'), message: [Book.opts.note, g('bk-msg')].filter(Boolean).join(' / '), lang: LANG };
  const btn = $('#bk-next'); btn.disabled = true; $('#bk-fail').textContent = '';
  const ep = CMS.settings.booking.endpoint; let sent = false;
  try {
    if (ep) { const r = await fetch(ep, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }); if (!r.ok) throw new Error(r.status); sent = true; }
    document.dispatchEvent(new CustomEvent('codera:booking', { detail: d }));
  } catch (e) { btn.disabled = false; $('#bk-fail').textContent = L('تعذّر إرسال الطلب. جرّب مرة أخرى أو تواصل معنا عبر WhatsApp.', 'We could not send your request. Try again, or reach us on WhatsApp.'); return; }
  const wa = `${CMS.contact.whatsapp}?text=${encodeURIComponent(bookingMessage(d))}`;
  const done = $('#bk-done'); $('#bk-form').hidden = true; $('.bk-prog').hidden = true; $('#bk-count').hidden = true; done.hidden = false;
  done.innerHTML = `<span class="done-ic" aria-hidden="true">${ico('check')}</span>
    <h2 class="h2">${sent ? L('تم استلام طلبك بنجاح', 'We received your request') : L('طلبك جاهز', 'Your request is ready')}</h2>
    <p class="lead">${sent ? L('فريق Codera Tech هيتواصل معاك قريبًا.', 'The Codera Tech team will contact you soon.') : L('أرسله الآن عبر WhatsApp ليصل إلى فريق Codera Tech مباشرة، وهيتواصلوا معاك قريبًا.', 'Send it now on WhatsApp so it reaches the Codera Tech team directly, and they will get back to you soon.')}</p>
    <div class="row"><a class="btn btn-wa lg" href="${wa}" target="_blank" rel="noopener">${ico('whatsapp')}${sent ? L('كمّل على WhatsApp', 'Continue on WhatsApp') : L('أرسل عبر WhatsApp', 'Send on WhatsApp')}</a><button class="btn btn-ghost" type="button" data-close>${L('إغلاق', 'Close')}</button></div>
    ${!sent && CMS.settings.demo ? `<p class="mono demo-note">${L('وضع المعاينة: لم يُرسل الطلب إلى خادم. اضبط settings.booking.endpoint لتفعيل الإرسال.', 'Preview mode: nothing was sent to a server. Set settings.booking.endpoint to enable submission.')}</p>` : ''}`;
  done.focus();
}

/* =====================================================================
   READER — page navigation, zoom, fullscreen, close, download.
   Uses real page images (guide.pages) when present; otherwise renders
   preview pages from the guide's own outline.
   ===================================================================== */
const Reader = { g: null, i: 0, z: 1, close: null, pages: [] };
const ZOOMS = [.75, 1, 1.25, 1.5, 2];

function readerPages(g) {
  if (g.pages && g.pages.length) return g.pages.map(src => ({ img: src }));
  const out = [{ html: coverHTML(g) }, { html: `<div class="rd-toc"><h3 class="h3">${L('المحتويات', 'Contents')}</h3><ol>${(g.outline || []).map(o => `<li>${T(o)}</li>`).join('')}</ol></div>` }];
  (g.outline || []).forEach((o, i) => out.push({ html: `<div class="rd-sec"><span class="mono">0${i + 1}</span><h3 class="h2">${T(o)}</h3><p>${L('صفحة معاينة. تُستبدل بصفحات الملف الفعلي عند رفعه من لوحة التحكم.', 'Preview page. Replaced by the real pages once the file is uploaded from the dashboard.')}</p></div>` }));
  return out;
}
function openReader(slug) {
  const g = vis(CMS.guides).find(x => x.slug === slug); if (!g) return;
  Reader.g = g; Reader.i = 0; Reader.z = 1; Reader.pages = readerPages(g);
  const el = $('#reader');
  el.innerHTML = `<div class="rd-shell tone-ink" role="dialog" aria-modal="true" aria-label="${esc(t(g.title))}">
    <div class="rd-bar"><button class="icon-btn" type="button" data-close aria-label="${esc(L('إغلاق المعاينة', 'Close preview'))}">${ico('close')}</button>
      <h2 class="rd-title">${T(g.title)}</h2>
      <div class="rd-tools" role="toolbar" aria-label="${esc(L('أدوات القارئ', 'Reader tools'))}">
        <button class="icon-btn" type="button" data-rd="zout" aria-label="${esc(L('تصغير', 'Zoom out'))}">${ico('zout')}</button><span class="rd-z mono" id="rd-z" aria-live="polite">100%</span>
        <button class="icon-btn" type="button" data-rd="zin" aria-label="${esc(L('تكبير', 'Zoom in'))}">${ico('zin')}</button>
        <button class="icon-btn" type="button" data-rd="full" aria-label="${esc(L('ملء الشاشة', 'Fullscreen'))}">${ico('full')}</button>
        ${g.file ? `<a class="icon-btn" href="${esc(g.file)}" download aria-label="${esc(L('تحميل', 'Download'))}">${ico('download')}</a>` : `<button class="icon-btn" type="button" disabled aria-label="${esc(L('تحميل (الملف غير متاح بعد)', 'Download (file not available yet)'))}">${ico('download')}</button>`}</div></div>
    <div class="rd-stage" id="rd-stage" tabindex="0" aria-label="${esc(L('صفحات الدليل', 'Guide pages'))}"><div class="rd-page" id="rd-page"></div></div>
    <div class="rd-nav"><button class="icon-btn" type="button" data-rd="prev" aria-label="${esc(L('الصفحة السابقة', 'Previous page'))}">${ico('prev')}</button><span class="mono" id="rd-n" aria-live="polite"></span><button class="icon-btn" type="button" data-rd="next" aria-label="${esc(L('الصفحة التالية', 'Next page'))}">${ico('next')}</button></div></div>`;
  const onClick = e => { if (e.target === el || e.target.closest('[data-close]')) { Reader.close && Reader.close(); return; } const b = e.target.closest('[data-rd]'); if (b) readerAct(b.dataset.rd); };
  const onKey = e => {
    const rtl = LANG === 'ar';
    if (e.key === 'ArrowRight') readerAct(rtl ? 'prev' : 'next'); else if (e.key === 'ArrowLeft') readerAct(rtl ? 'next' : 'prev');
    else if (e.key === '+' || e.key === '=') readerAct('zin'); else if (e.key === '-') readerAct('zout'); else if (e.key.toLowerCase() === 'f') readerAct('full');
  };
  el.addEventListener('click', onClick); document.addEventListener('keydown', onKey);
  Reader.close = openModal(el, { onClose() { document.removeEventListener('keydown', onKey); el.removeEventListener('click', onClick); if (document.fullscreenElement) document.exitFullscreen(); Reader.close = null; } });
  paintReader();
}
function paintReader() {
  const p = Reader.pages[Reader.i], host = $('#rd-page');
  host.innerHTML = p.img ? `<img src="${esc(p.img)}" alt="${esc(t(Reader.g.title) + ' ' + (Reader.i + 1))}" decoding="async">` : p.html;
  host.style.setProperty('--z', Reader.z);
  $('#rd-n').textContent = `${Reader.i + 1} / ${Reader.pages.length}`;
  $('#rd-z').textContent = Math.round(Reader.z * 100) + '%';
  $('[data-rd=prev]').disabled = Reader.i === 0; $('[data-rd=next]').disabled = Reader.i === Reader.pages.length - 1;
}
function readerAct(a) {
  if (a === 'next') Reader.i = Math.min(Reader.pages.length - 1, Reader.i + 1);
  else if (a === 'prev') Reader.i = Math.max(0, Reader.i - 1);
  else if (a === 'zin') Reader.z = ZOOMS[Math.min(ZOOMS.length - 1, ZOOMS.indexOf(Reader.z) + 1)];
  else if (a === 'zout') Reader.z = ZOOMS[Math.max(0, ZOOMS.indexOf(Reader.z) - 1)];
  else if (a === 'full') { const s = $('.rd-shell'); if (document.fullscreenElement) document.exitFullscreen(); else if (s.requestFullscreen) s.requestFullscreen(); return; }
  paintReader();
}
/* =====================================================================
   APP: celebration layer, chrome, router, scroll UI, delegation, init
   ===================================================================== */
const onLeaveFns = []; const onLeave = f => onLeaveFns.push(f);
let CUR = { path: '/', home: false };
const Menu = { close: null };

/* ---------- Celebration layer (optional, subtle, never replaces the brand) ---------- */
const CEL = {
  ramadan:          { label: D('رمضان كريم', 'Ramadan Kareem'), motif: 'ramadan' },
  'eid-fitr':       { label: D('عيد فطر مبارك', 'Eid Mubarak'), motif: 'sparkles' },
  'eid-adha':       { label: D('عيد أضحى مبارك', 'Eid Al-Adha Mubarak'), motif: 'sparkles' },
  anniversary:      { label: D('عيد ميلاد Codera Tech', 'Codera Tech anniversary'), motif: 'confetti' },
  graduation:       { label: D('موسم التخرّج', 'Graduation season'), motif: 'cap' },
  'back-to-school': { label: D('العودة للدراسة', 'Back to school'), motif: 'book' },
  custom:           { label: D('مناسبة خاصة', 'Special occasion'), motif: 'sparkles' }
};
let celActive = null;
const star4 = (x, y, r) => `<path d="M${x} ${y - r}l${r * .28} ${r * .72} ${r * .72} ${r * .28}-${r * .72} ${r * .28}-${r * .28} ${r * .72}-${r * .28}-${r * .72}-${r * .72}-${r * .28} ${r * .72}-${r * .28}z" fill="currentColor"/>`;
const MOTIFS = {
  ramadan: `<svg viewBox="0 0 220 150" fill="none"><path d="M128 18a40 40 0 1 0 34 60 32 32 0 1 1-34-60z" fill="currentColor"/>${star4(170, 34, 14)}${star4(196, 70, 8)}${star4(104, 96, 7)}
    <path d="M40 0v30" stroke="currentColor" stroke-width="2"/><path d="M28 30h24l4 10v24a16 16 0 0 1-32 0V40z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M40 82v14M34 40v30M46 40v30" stroke="currentColor" stroke-width="1.6" opacity=".7"/></svg>`,
  sparkles: `<svg viewBox="0 0 220 120" fill="none">${star4(60, 52, 30)}${star4(130, 30, 16)}${star4(168, 78, 22)}${star4(104, 92, 9)}</svg>`,
  cap: `<svg viewBox="0 0 220 120" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M110 22 28 54l82 32 82-32z"/><path d="M60 68v22c0 8 22 16 50 16s50-8 50-16V68"/><path d="M192 54v36"/></svg>`,
  book: `<svg viewBox="0 0 220 120" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M110 30c-18-12-46-14-70-8v66c24-6 52-4 70 8 18-12 46-14 70-8V22c-24-6-52-4-70 8z"/><path d="M110 30v66"/></svg>`,
  confetti: ''
};
function applyCelebration(id) {
  celActive = CEL[id] ? id : null;
  const root = document.documentElement;
  if (celActive) root.dataset.celebration = celActive; else delete root.dataset.celebration;
  $('#cel').innerHTML = celActive ? (MOTIFS[CEL[celActive].motif] || '') : '';
  if (celActive === 'anniversary' && !reduceMotion) {
    const host = $('#confetti'), colors = ['#0074D9', '#F5C969', '#FFFFFF', '#6DB6FF'];
    host.innerHTML = Array.from({ length: 42 }, (_, i) => `<i style="left:${(i * 97) % 100}%;background:${colors[i % 4]};animation-delay:${(i % 9) * .12}s;--r:${(i * 53) % 360}deg;--x:${((i * 31) % 60) - 30}px"></i>`).join('');
    setTimeout(() => { host.innerHTML = ''; }, 4200);
  }
}
const celBadge = () => celActive ? `<span class="cel-badge">${T(CMS.celebration.text && celActive === (CMS.celebration.active || celActive) ? CMS.celebration.text : CEL[celActive].label)}</span>` : '';

/* ---------- Chrome ---------- */
function renderChrome() {
  const { path } = parseHash();
  const items = vis(CMS.nav).filter(n => !n.needs || vis(CMS[n.needs]).length);
  const act = n => (n.path === '/' ? path === '/' : path === n.path || path.startsWith(n.path + '/'));
  const links = (cls) => items.map(n => `<a${cls ? ` class="${cls}"` : ''} href="${href(n.path)}"${act(n) ? ' aria-current="page"' : ''}>${T(n.label)}</a>`).join('');
  const langBtn = `<button class="icon-btn lang-btn" type="button" data-lang="${LANG === 'ar' ? 'en' : 'ar'}" lang="${LANG === 'ar' ? 'en' : 'ar'}" aria-label="${LANG === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'}">${ico('globe')}<span>${LANG === 'ar' ? 'EN' : 'عربي'}</span></button>`;
  const themeBtn = `<button class="icon-btn" type="button" data-theme-toggle aria-label="${esc(THEME === 'dark' ? L('الوضع الفاتح', 'Switch to light mode') : L('الوضع الداكن', 'Switch to dark mode'))}">${ico(THEME === 'dark' ? 'sun' : 'moon')}</button>`;
  const brand = `<a class="brand" href="#/" aria-label="${esc(CMS.settings.brand)}">${CMS.settings.logo ? `<img src="${esc(CMS.settings.logo)}" alt="" height="28">` : `<span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>`}<b>Codera</b><span>Tech</span></a>`;

  $('#nav').innerHTML = `<div class="nav-in">${brand}${celBadge()}
    <nav class="nav-links" aria-label="${esc(L('التنقل الرئيسي', 'Main navigation'))}">${links()}</nav>
    <div class="nav-tools">${langBtn}${themeBtn}<button class="btn btn-solid sm nav-cta" type="button" data-book>${BOOK()}</button>
      <button class="icon-btn nav-burger" type="button" data-menu aria-expanded="${!!Menu.close}" aria-controls="menu" aria-label="${esc(L('القائمة', 'Menu'))}">${ico('menu')}</button></div></div>`;

  $('#menu').innerHTML = `<div class="menu-in tone-ink" role="dialog" aria-modal="true" aria-label="${esc(L('القائمة', 'Menu'))}">
    <div class="menu-top">${brand}<button class="icon-btn" type="button" data-menu aria-label="${esc(L('إغلاق القائمة', 'Close menu'))}">${ico('close')}</button></div>
    <nav class="menu-links" aria-label="${esc(L('التنقل الرئيسي', 'Main navigation'))}">${links()}</nav>
    <div class="menu-foot"><button class="btn btn-solid lg" type="button" data-book>${BOOK()}</button><div class="row">${langBtn}${themeBtn}</div></div></div>`;

  const c = CMS.contact;
  $('#footer').innerHTML = `<div class="wrap foot">
    <div class="foot-brand">${brand}<p class="foot-tag mono">${esc(CMS.settings.tagline)}</p><p>${T(CMS.settings.name)}</p>
      <div class="row"><button class="btn btn-solid" type="button" data-book>${BOOK()}</button><a class="btn btn-ghost" href="${c.whatsapp}" target="_blank" rel="noopener">${ico('whatsapp')}WhatsApp</a></div></div>
    <nav class="foot-col" aria-label="${esc(L('روابط التذييل', 'Footer links'))}"><h2 class="h4">${L('استكشف', 'Explore')}</h2>${links()}</nav>
    <div class="foot-col"><h2 class="h4">${L('تواصل', 'Contact')}</h2>
      ${c.phones.map(p => `<a class="mono" href="tel:${phoneIntl(p)}">${esc(p)}</a>`).join('')}<a class="mono" href="mailto:${esc(c.email)}">${esc(c.email)}</a><span>${T(c.address)}</span></div>
    <div class="foot-col"><h2 class="h4">${L('تابعنا', 'Follow us')}</h2>${socialIcons()}<div class="row">${langBtn}${themeBtn}</div>
      ${CMS.settings.demo ? `<label class="cel-pick mono" for="celPick">${L('معاينة المناسبات', 'Celebration preview')}<select id="celPick" class="in"><option value="">${L('بدون', 'None')}</option>${Object.keys(CEL).map(k => `<option value="${k}"${k === celActive ? ' selected' : ''}>${esc(t(CEL[k].label))}</option>`).join('')}</select></label>` : ''}</div>
    <p class="foot-legal">© ${new Date().getFullYear()} ${esc(CMS.settings.brand)} · ${T(CMS.settings.name)}</p></div>`;

  $('#sticky').innerHTML = `<button class="btn btn-solid lg" type="button" data-book>${BOOK()}</button>`;
  $('.skip').textContent = L('تخطّي إلى المحتوى', 'Skip to content');
}

/* ---------- Router ---------- */
function parseHash() { const h = location.hash.replace(/^#/, '') || '/'; const [path, qs] = h.split('?'); return { path: path || '/', q: new URLSearchParams(qs || '') }; }
const ROUTES = [
  [/^\/$/, () => pageHome()], [/^\/about\/?$/, () => pageAbout()],
  [/^\/courses\/?$/, () => pageCourses()], [/^\/courses\/([\w-]+)\/?$/, m => pageCourse(m[1])],
  [/^\/services\/?$/, () => pageServices()],
  [/^\/instructors\/?$/, () => pageInstructors()], [/^\/instructors\/([\w-]+)\/?$/, m => pageInstructor(m[1])],
  [/^\/events\/?$/, () => pageEvents()], [/^\/events\/([\w-]+)\/?$/, m => pageEvent(m[1])],
  [/^\/guides\/?$/, () => pageGuides()], [/^\/guides\/([\w-]+)\/?$/, m => pageGuide(m[1])],
  [/^\/contact\/?$/, () => pageContact()]
];
let lastPath = null;
function render(keepScroll) {
  onLeaveFns.splice(0).forEach(f => f());
  const { path, q } = parseHash();
  if (path !== '/courses') { S.cat = 'all'; S.level = 'all'; }
  let res = null;
  for (const [re, fn] of ROUTES) { const m = path.match(re); if (m) { res = fn(m); break; } }
  res = res || page404();
  CUR = { path, home: !!res.home };
  if (q.get('celebrate') !== null) applyCelebration(q.get('celebrate'));
  $('#app').innerHTML = res.html;
  setMeta(res.meta);
  if (!keepScroll) window.scrollTo(0, 0);
  renderChrome();
  if (res.after) res.after();
  bindReveal(); updateUI();
  if (!keepScroll && lastPath !== null) { $('#app').focus({ preventScroll: true }); announce(document.title); }
  lastPath = path;
}

/* ---------- Scroll UI: nav mode, sticky CTA, progress lines ---------- */
let ticking = false;
const schedUI = () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; updateUI(); }); } };
const modalOpen = () => $$('.modal').some(m => !m.hidden);
function updateUI() {
  const nav = $('#nav'); if (!nav) return;
  const sig = CUR.home ? $('#sig') : null;
  const immersive = !!sig && sig.getBoundingClientRect().bottom > 80;
  nav.classList.toggle('solid', !immersive); nav.classList.toggle('tone-paper', !immersive); nav.classList.toggle('compact', scrollY > 24);
  $('#sticky').classList.toggle('on', !immersive && !modalOpen());
  $$('[data-prog]').forEach(el => {
    const r = el.getBoundingClientRect(), p = reduceMotion ? 1 : clamp((innerHeight * .62 - r.top) / Math.max(r.height, 1));
    el.style.setProperty('--p', p.toFixed(3));
  });
}
let io = null;
function bindReveal() {
  const els = $$('.rv:not(.in)');
  if (reduceMotion || !('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  io = io || new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -12% 0px', threshold: .15 });
  els.forEach(e => io.observe(e));
}

/* ---------- Language / theme / menu ---------- */
function applyLang() { const h = document.documentElement; h.lang = LANG; h.dir = LANG === 'ar' ? 'rtl' : 'ltr'; }
function setLang(l) { if (l === LANG) return; LANG = l; store.set('codera-lang', l); applyLang(); render(true); }
function setTheme(th) { THEME = th; document.documentElement.dataset.theme = th; store.set('codera-theme', th); renderChrome(); }
function toggleMenu() {
  if (Menu.close) { Menu.close(); return; }
  Menu.close = openModal($('#menu'), { onClose() { Menu.close = null; $$('.nav-burger').forEach(b => b.setAttribute('aria-expanded', 'false')); } });
  $$('.nav-burger').forEach(b => b.setAttribute('aria-expanded', 'true'));
}

/* ---------- Delegated interactions ---------- */
document.addEventListener('click', e => {
  const el = e.target;
  if (el.closest('.skip')) { e.preventDefault(); $('#app').focus(); return; }
  const bk = el.closest('[data-book]');
  if (bk) { e.preventDefault(); if (Menu.close) Menu.close(); openBooking({ course: bk.dataset.book || '', note: bk.dataset.note || '', name: S.draftName }); return; }
  const rd = el.closest('[data-read]'); if (rd) { e.preventDefault(); openReader(rd.dataset.read); return; }
  const lg = el.closest('[data-lang]'); if (lg) { setLang(lg.dataset.lang); return; }
  if (el.closest('[data-theme-toggle]')) { setTheme(THEME === 'dark' ? 'light' : 'dark'); return; }
  if (el.closest('[data-menu]')) { toggleMenu(); return; }
  if (el.closest('#menu a') && Menu.close) { Menu.close(); return; }
  if (el.closest('.menu-modal') === $('#menu') && el === $('#menu') && Menu.close) { Menu.close(); return; }
  const a = el.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'path-cat') {
    const cat = a.dataset.cat;
    $$('.cat-filter .chip').forEach(c => c.setAttribute('aria-pressed', c === a));
    $$('.stages .node:not(.extra)').forEach(n => n.classList.toggle('dim', cat !== 'all' && n.dataset.cat !== cat));
  } else if (act === 'story') {
    S.story = +a.dataset.i; $('#stories-body').innerHTML = storiesInner(); const b = $(`#stories-body [data-i="${S.story}"]`); b && b.focus();
  } else if (act === 'course-cat' || act === 'course-level') {
    S[act === 'course-cat' ? 'cat' : 'level'] = a.dataset.v;
    const cs = vis(CMS.courses); $('#course-filters').innerHTML = courseFilters(cs); $('#course-list').innerHTML = courseRows();
    const b = $(`#course-filters [data-act="${act}"][data-v="${a.dataset.v}"]`); b && b.focus();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'hello-in') { S.draftName = e.target.value.trim(); const n = $('#hello-name'); if (n) n.textContent = S.draftName || 'Codera'; }
});
document.addEventListener('change', e => { if (e.target.id === 'celPick') applyCelebration(e.target.value); renderChromeKeepFocus(e.target); });
function renderChromeKeepFocus(t0) { if (t0 && t0.id === 'celPick') { renderChrome(); const s = $('#celPick'); s && s.focus(); } }
document.addEventListener('submit', e => {
  if (e.target.id !== 'contact-form') return;
  e.preventDefault();
  const n = $('#ct-name').value.trim(), m = $('#ct-msg').value.trim(), er = $('#ct-err');
  if (n.length < 2 || m.length < 2) { er.textContent = L('اكتب اسمك ورسالتك أولًا.', 'Please add your name and a message first.'); return; }
  er.textContent = '';
  window.open(`${CMS.contact.whatsapp}?text=${encodeURIComponent((LANG === 'ar' ? 'مرحبًا Codera Tech، أنا ' : 'Hello Codera Tech, I am ') + n + '. ' + m)}`, '_blank', 'noopener');
});

/* ---------- Init ---------- */
(function init() {
  const sl = store.get('codera-lang'); LANG = (sl === 'en' || sl === 'ar') ? sl : 'ar';
  THEME = store.get('codera-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = THEME; applyLang();
  applyCelebration(new URLSearchParams(location.search).get('celebrate') || CMS.celebration.active);
  addEventListener('hashchange', () => render(false));
  addEventListener('scroll', schedUI, { passive: true }); addEventListener('resize', schedUI);
  render(false);
})();
